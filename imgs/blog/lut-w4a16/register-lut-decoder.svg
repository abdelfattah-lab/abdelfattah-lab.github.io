   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172638" transform="translate(285.686511 81.830904)">Bank 0: codes 0–7</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172638" transform="translate(300.369324 94.928326)">8 high bytes</text>
   </g>
   <g id="text_5">
