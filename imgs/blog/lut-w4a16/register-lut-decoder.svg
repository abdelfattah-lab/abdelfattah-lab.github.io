   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172638" x="10.8" y="32.038871" transform="rotate(-0 10.8 32.038871)">A 16-entry codebook in four 32-bit words</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #46566a" x="10.8" y="46.623024" transform="rotate(-0 10.8 46.623024)">The current decoder stores each FP16 entry’s high byte; every low byte is zero.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172638" transform="translate(47.996903 115.082237)">4 packed codes</text>
